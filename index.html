<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知英語｜課程方案說明</title>
<style>
  :root{
    --ink:#221F1B; --surface:#F6F4F3; --card:#ffffff;
    --petrol:#1B4D46; --petrol-deep:#123A34;
    --amber:#E36B47; --amber-soft:#FBE6D2;
    --line:#E7E4DF; --slate:#726C64;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--surface);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.65;}
  .wrap{max-width:760px;margin:0 auto;padding:64px 22px 90px;}
  .eyebrow{font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--petrol);font-weight:700;margin:0 0 10px;}
  h1{font-size:clamp(24px,4vw,32px);margin:0 0 10px;font-weight:800;letter-spacing:-.01em;}
  .lead{color:var(--slate);font-size:15px;margin:0 0 36px;}
  .cardlist{display:flex;flex-direction:column;gap:16px;}
  a.card{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;text-decoration:none;color:inherit;transition:box-shadow .15s,border-color .15s,transform .15s;}
  a.card:hover{border-color:var(--petrol);box-shadow:0 10px 24px rgba(0,0,0,.08);transform:translateY(-2px);}
  .cname{font-size:18px;font-weight:800;color:var(--petrol-deep);}
  .ctag{font-size:13.5px;color:var(--slate);}
  .cgo{margin-top:8px;font-size:13px;font-weight:700;color:var(--amber);}
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">J English 知英語</p>
    <h1>課程方案說明</h1>
    <p class="lead">請點選以下方案，查看完整課程內容、價格與注意事項。</p>
    <div class="cardlist">
      <a class="card" href="ielts-70-guarantee.html">
        <span class="cname">60 天 7.0 保證班</span>
        <span class="ctag">兩個月內、有保證地拿到 7.0，買的是「確定達標」。</span>
        <span class="cgo">查看方案內容 →</span>
      </a>
      <a class="card" href="ielts-60-guarantee.html">
        <span class="cname">60 天 6.0 保證班</span>
        <span class="ctag">目標 6.0（多為移民／工作簽），要保證達標。</span>
        <span class="cgo">查看方案內容 →</span>
      </a>
      <a class="card" href="ielts-30hr-crash.html">
        <span class="cname">30 小時雅思速成班</span>
        <span class="ctag">新手入門首選，短時間把四科解題技巧打包學會。</span>
        <span class="cgo">查看方案內容 →</span>
      </a>
      <a class="card" href="ielts-foundation.html">
        <span class="cname">雅思先修／打底計劃（2026）</span>
        <span class="ctag">還沒到能準備雅思的程度，先打底；分級進階，過 B1+ 後接軌雅思。</span>
        <span class="cgo">查看方案內容 →</span>
      </a>
    </div>
  </div>
</body>
</html>
