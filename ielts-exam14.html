<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知英語｜考前 14 天衝刺</title>
<style>
  :root{
    --ink:#221F1B; --surface:#F6F4F3; --card:#ffffff;
    --petrol:#1B4D46; --petrol-deep:#123A34;
    --amber:#E36B47; --amber-soft:#FBE6D2; --gold:#E36B47;
    --rose:#C0503A; --rose-soft:#F7E4DF;
    --slate:#726C64; --line:#E7E4DF; --line-strong:#D9D2C5;
    --ok:#1B4D46; --violet:#445E63; --violet-soft:#EDF1F2;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--surface);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.65;font-size:15.5px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 22px 90px;}
  a{color:inherit;}

  /* header + nav */
  header{padding:34px 0 0;border-bottom:2px solid var(--ink);}
  .topline{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;}
  .eyebrow{font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--petrol);font-weight:700;margin:0 0 8px;}
  h1{font-size:clamp(22px,3.6vw,30px);margin:0;font-weight:800;letter-spacing:-.01em;}
  .biztoggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer;user-select:none;border:1.5px solid var(--line-strong);border-radius:999px;padding:8px 16px;background:#fff;font-size:14px;font-weight:700;transition:all .15s;white-space:nowrap;}
  .biztoggle:hover{border-color:var(--petrol);}
  .biztoggle .dot{width:34px;height:19px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .2s;flex:none;}
  .biztoggle .dot::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .2s;}
  body.biz .biztoggle{border-color:var(--rose);color:var(--rose);}
  body.biz .biztoggle .dot{background:var(--rose);}
  body.biz .biztoggle .dot::after{transform:translateX(15px);}
  nav{display:flex;gap:4px;margin-top:22px;flex-wrap:wrap;}
  nav a{padding:11px 18px;font-size:14.5px;font-weight:700;color:var(--slate);text-decoration:none;border-bottom:3px solid transparent;transition:all .15s;}
  nav a:hover{color:var(--ink);}
  nav a.active{color:var(--ink);border-bottom-color:var(--petrol);}
  .bizbanner{display:none;margin:14px 0 0;padding:10px 16px;border-radius:10px;background:var(--rose-soft);color:#8f3636;font-size:13.5px;font-weight:600;border:1px solid #eccac4;}
  body.biz .bizbanner{display:block;}

  /* shared */
  .draftpill{display:none;font-size:10.5px;font-weight:700;color:#9a5e0e;background:var(--amber-soft);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px;}
  body.biz .draftpill{display:none;}
  .crumb{margin:24px 0 10px;font-size:13.5px;}
  .crumb a{color:var(--petrol-deep);font-weight:700;text-decoration:none;}
  .crumb a:hover{text-decoration:underline;}
  .viewhead{margin:26px 0 4px;}
  .viewhead h2{font-size:23px;margin:0 0 4px;font-weight:800;letter-spacing:-.01em;}
  .viewhead p{font-size:14px;color:var(--slate);margin:0;}

  /* overview filters + diff strip */
  .filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:22px 0 6px;}
  .filters .flabel{font-size:13px;color:var(--slate);font-weight:700;margin-right:4px;}
  .chip{border:1.5px solid var(--line-strong);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;background:#fff;cursor:pointer;transition:all .15s;color:var(--ink);font-family:inherit;}
  .chip:hover{border-color:var(--petrol);}
  .chip.on{background:var(--petrol);border-color:var(--petrol);color:#fff;}
  .diffstrip{margin:20px 0 4px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;}
  .diffstrip h3{font-size:15px;margin:0 0 12px;font-weight:800;}
  .diffgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 26px;}
  @media(max-width:680px){.diffgrid{grid-template-columns:1fr;}}
  .diffitem{font-size:13.5px;}
  .diffitem b{display:block;color:var(--petrol-deep);font-size:13px;margin-bottom:2px;}
  .diffitem span{color:var(--slate);}

  /* card grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px;}
  @media(max-width:980px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 20px 18px;display:flex;flex-direction:column;position:relative;transition:opacity .2s,box-shadow .2s,border-color .2s;}
  .pcard.dim{opacity:.34;}
  .pcard.feat{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .ribbon{position:absolute;top:-1px;right:16px;background:var(--gold);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.05em;padding:5px 11px;border-radius:0 0 8px 8px;}
  .nonmain{position:absolute;top:14px;right:16px;font-size:11px;font-weight:700;color:var(--slate);background:#f0ede5;padding:3px 9px;border-radius:999px;}
  .pname{font-size:18px;font-weight:800;margin:4px 0 2px;letter-spacing:-.01em;line-height:1.3;}
  .ptag{font-size:13px;color:var(--slate);margin:0 0 14px;min-height:34px;}
  .priceblock{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:13px 0;margin-bottom:13px;}
  .porig{font-size:13px;color:var(--slate);text-decoration:line-through;margin-bottom:2px;}
  .pdeal-row{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;}
  .pcur{font-size:13px;color:var(--slate);font-weight:600;}
  .pinput{font-size:21px;font-weight:800;color:var(--petrol-deep);border:none;background:transparent;border-bottom:2px dotted var(--line-strong);width:120px;padding:1px 2px;font-family:inherit;}
  .pinput:focus{outline:none;border-bottom-color:var(--petrol);}
  .punit{font-size:13px;color:var(--slate);}
  .ptiers{font-size:12.5px;color:var(--slate);margin-top:7px;line-height:1.55;}
  .ladder{display:none;margin-top:10px;padding:11px 13px;background:#faf6ef;border:1px dashed var(--line-strong);border-radius:10px;font-size:12.5px;}
  body.biz .ladder{display:block;}
  .ladder .lrow{display:flex;justify-content:space-between;gap:10px;padding:2px 0;}
  .ladder .lrow span:first-child{color:var(--slate);}
  .ladder .lrow span:last-child{font-weight:700;font-variant-numeric:tabular-nums;}
  .ladder .flag{color:#8f3636;font-weight:600;margin-top:6px;padding-top:6px;border-top:1px dotted var(--line-strong);}
  .fit{font-size:13px;margin-bottom:12px;}
  .fit b{color:var(--ink);}
  ul.feat-list{list-style:none;margin:0 0 14px;padding:0;font-size:13.5px;}
  ul.feat-list li{padding:4px 0 4px 22px;position:relative;color:#3c463f;}
  ul.feat-list li::before{content:"";position:absolute;left:4px;top:11px;width:6px;height:6px;border-radius:50%;background:var(--petrol);}
  ul.feat-list li.guar::before{background:var(--gold);width:7px;height:7px;top:10px;}
  ul.feat-list li.guar{font-weight:700;color:var(--gold);}
  .internal{display:none;margin-bottom:14px;padding:12px 14px;background:var(--violet-soft);border-radius:10px;font-size:12.8px;color:var(--violet);}
  body.biz .internal{display:block;}
  .internal b{display:block;color:#445E63;margin-bottom:3px;font-size:12px;}
  .todo{color:#9a5e0e;font-style:italic;}
  .cardlink{margin-top:auto;display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;color:var(--petrol-deep);text-decoration:none;}
  .cardlink:hover{gap:9px;}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;border-radius:10px;padding:10px 18px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);transition:all .15s;text-decoration:none;}
  .btn:hover{background:#f0ede5;}
  .btn.primary{background:var(--ink);color:#fff;}
  .btn.primary:hover{background:var(--petrol-deep);border-color:var(--petrol-deep);}
  .btn.small{padding:7px 13px;font-size:13px;}

  /* selection chips list (compare + bundle) */
  .selbar{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-top:18px;}
  .selbar .seltitle{font-size:13px;font-weight:700;color:var(--slate);margin:0 0 12px;}
  .selgrid{display:flex;flex-wrap:wrap;gap:9px;}
  .selchk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:1.5px solid var(--line-strong);border-radius:10px;padding:8px 13px;font-size:13.5px;background:#fff;user-select:none;transition:all .15s;}
  .selchk:hover{border-color:var(--petrol);}
  .selchk input{accent-color:var(--petrol);width:15px;height:15px;margin:0;}
  .selchk.on{background:var(--petrol);border-color:var(--petrol);color:#fff;}
  .selactions{margin-top:14px;display:flex;gap:10px;align-items:center;}
  .selhint{font-size:13px;color:var(--slate);}

  /* compare table */
  .cmpwrap{margin-top:20px;overflow-x:auto;}
  table.cmp{border-collapse:collapse;width:100%;min-width:540px;font-size:13.8px;}
  table.cmp th,table.cmp td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
  table.cmp thead th{position:sticky;top:0;background:var(--surface);}
  table.cmp .rowlabel{font-size:12.5px;font-weight:700;color:var(--slate);white-space:nowrap;background:#faf8f3;border-right:1px solid var(--line);}
  table.cmp .planhead{font-weight:800;font-size:15px;}
  table.cmp .planhead .mini{display:block;font-size:11.5px;font-weight:600;color:var(--petrol);margin-top:2px;}
  table.cmp td.cell{color:#3c463f;}
  table.cmp tr.differs .rowlabel{color:var(--amber);}
  table.cmp tr.differs td.cell{background:#fdfaf3;}
  table.cmp .priceC{font-weight:800;color:var(--petrol-deep);}
  .cmpnote{font-size:12.8px;color:var(--slate);margin-top:10px;}
  .legendline{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--amber);font-weight:600;}
  .legendline i{width:14px;height:14px;border-radius:3px;background:#fdfaf3;border:1px solid var(--amber);display:inline-block;}

  /* bundle results */
  .bundlewrap{margin-top:22px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  @media(max-width:760px){.bundlewrap{grid-template-columns:1fr;}}
  .bcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;border-left:4px solid var(--petrol);}
  .bcard .bpair{font-size:13px;color:var(--slate);font-weight:700;margin-bottom:6px;}
  .bcard .bprice{font-size:22px;font-weight:800;color:var(--petrol-deep);margin-bottom:6px;}
  .bcard .bnote{font-size:13px;color:#3c463f;}
  .bcard .btag{display:inline-block;margin-top:10px;font-size:11px;font-weight:700;color:var(--violet);background:var(--violet-soft);padding:3px 9px;border-radius:999px;}
  .bundle-empty{margin-top:22px;padding:26px;background:var(--card);border:1px dashed var(--line-strong);border-radius:14px;color:var(--slate);font-size:14px;text-align:center;}

  /* detail page */
  .detailhead{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap;margin-top:8px;}
  .detailhead h2{font-size:26px;margin:0 0 6px;font-weight:800;letter-spacing:-.01em;}
  .badge{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:999px;vertical-align:3px;margin-left:8px;}
  .badge.main{background:var(--gold);color:#fff;}
  .badge.non{background:#f0ede5;color:var(--slate);}
  .dtag{font-size:15px;color:var(--slate);margin:0 0 18px;}
  .dlayout{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-top:8px;}
  @media(max-width:820px){.dlayout{grid-template-columns:1fr;}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;}
  .panel h3{font-size:14px;margin:0 0 12px;font-weight:800;letter-spacing:.02em;}
  table.spec{width:100%;border-collapse:collapse;font-size:13.8px;}
  table.spec th,table.spec td{padding:9px 2px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;}
  table.spec th{font-weight:700;color:var(--slate);width:92px;white-space:nowrap;font-size:13px;}
  .bigprice{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .bigprice .pinput{font-size:26px;width:140px;}
  .dcombos{margin-top:14px;}
  .dcombo{padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .dcombo:last-child{border-bottom:none;}
  .dcombo b{color:var(--petrol-deep);}
  .dcombo .cnote{display:block;color:var(--slate);font-size:12.7px;margin-top:2px;}
  .detail-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}

  .empty{display:none;text-align:center;color:var(--slate);padding:50px 0;font-size:15px;}
  .empty.show{display:block;}
  .foot{margin-top:34px;padding:20px 24px;background:var(--card);border:1px dashed var(--line-strong);border-radius:14px;font-size:13.3px;color:var(--slate);}
  .foot h3{font-size:14px;color:var(--ink);margin:0 0 8px;}
  .foot ul{margin:0;padding-left:18px;} .foot li{margin:4px 0;} .foot b{color:var(--rose);}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important;}}

  .brandblock{display:flex;align-items:center;gap:16px;}
  .logo{height:54px;width:auto;display:block;}
  @media(max-width:560px){.logo{height:42px;}}

  /* level map */
  .lm-intro{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;font-size:13.5px;color:#3c463f;}
  .lm-intro b{color:var(--brand-deep,#445E63);}
  .lm-scroll{margin-top:18px;overflow-x:auto;}
  .lmap{min-width:760px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);}
  .lmap-head,.lmap-row{display:grid;grid-template-columns:104px 96px 104px 1.5fr 1.7fr;}
  .lmap-head>div{font-size:12px;font-weight:700;color:var(--slate);padding:12px 14px;background:#faf6ef;border-bottom:1.5px solid var(--line-strong);}
  .lmap-row>div{padding:14px;border-bottom:1px solid var(--line);font-size:13.2px;vertical-align:top;}
  .lmap-row:last-child>div{border-bottom:none;}
  .lmap-row .cefr{display:flex;flex-direction:column;justify-content:center;font-weight:800;}
  .lmap-row .cefr .cname{font-size:11.5px;font-weight:600;opacity:.92;margin-top:2px;}
  .lmap-row .ielts{font-weight:800;color:var(--petrol-deep);font-variant-numeric:tabular-nums;display:flex;align-items:center;}
  .lmap-row .toeic{color:#3c463f;font-variant-numeric:tabular-nums;display:flex;align-items:center;}
  .lmap-row .desc{color:#3c463f;}
  .lmap-row .course{background:var(--amber-soft);color:var(--petrol-deep);font-weight:600;}
  .lm-call{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:680px){.lm-call{grid-template-columns:1fr;}}
  .lm-callcard{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:14px 18px;background:var(--card);font-size:13.3px;}
  .lm-callcard b{color:var(--petrol-deep);}
  .lm-mini{margin-top:22px;}
  .lm-mini h3{font-size:14px;margin:0 0 10px;font-weight:800;}
  table.lmmini{border-collapse:collapse;font-size:13px;}
  table.lmmini th,table.lmmini td{border:1px solid var(--line);padding:7px 16px;text-align:center;}
  table.lmmini th{background:#faf6ef;font-weight:700;color:var(--slate);font-size:12.5px;}
  table.lmmini td:first-child{font-weight:700;color:var(--petrol-deep);}
  .lm-src{margin-top:16px;font-size:12.3px;color:var(--slate);}

  /* pack buttons */
  .packbtns{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
  .packbtn{font-family:inherit;font-size:12.5px;font-weight:700;border:1.5px solid var(--line-strong);background:#fff;color:var(--ink);border-radius:8px;padding:5px 11px;cursor:pointer;transition:all .12s;}
  .packbtn:hover{border-color:var(--petrol);}
  .packbtn.on{background:var(--petrol);border-color:var(--petrol);color:#fff;}
  /* bundle equations */
  .eqwrap{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:760px){.eqwrap{grid-template-columns:1fr;}}
  .eqcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--petrol);border-radius:14px;padding:18px 20px;}
  .eqhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:14.5px;}
  .eqhead .eqplus{color:var(--gold);font-size:18px;font-weight:800;}
  .eqresult{display:flex;align-items:baseline;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .eqresult .eqeq{font-size:20px;font-weight:800;color:var(--slate);}
  .eqorig{color:var(--slate);font-size:14px;}
  .eqbig{font-size:21px;font-weight:800;color:var(--petrol-deep);}
  .eqlines{margin-top:10px;}
  .eqline{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.2px;}
  .eqline:last-child{border-bottom:none;}
  .eqline .eql{color:#3c463f;font-weight:600;}
  .eqline .eqr{text-align:right;}
  .eqline .eqr s{color:var(--slate);margin-right:6px;}
  .eqline .eqr b{color:var(--petrol-deep);}
  .eqline .eqsub{display:block;font-size:11.6px;color:var(--slate);font-weight:400;}
  .eqnote{margin-top:12px;font-size:12.8px;color:var(--slate);}
  /* schedule */
  .sched-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px;}
  .sched-tab{font-family:inherit;font-size:13.5px;font-weight:700;border:1.5px solid var(--line-strong);background:#fff;color:var(--ink);border-radius:999px;padding:8px 15px;cursor:pointer;transition:all .12s;}
  .sched-tab:hover{border-color:var(--petrol);}
  .sched-tab.on{background:var(--petrol);border-color:var(--petrol);color:#fff;}
  .sched-note{font-size:12.8px;color:var(--slate);margin:8px 0 0;line-height:1.6;}
  .sched-scroll{overflow-x:auto;margin-top:14px;}
  table.sched{border-collapse:collapse;width:100%;min-width:640px;}
  table.sched th,table.sched td{border:1px solid var(--line);padding:11px 13px;text-align:left;vertical-align:top;font-size:13px;}
  table.sched thead th{background:var(--petrol);color:#fff;font-size:12.5px;font-weight:700;}
  table.sched thead th.wk,table.sched td.wk{width:54px;text-align:center;}
  table.sched td.wk{font-weight:800;color:var(--petrol-deep);}
  table.sched .dt{font-weight:700;color:var(--petrol-deep);white-space:nowrap;}
  table.sched .en{display:block;font-size:11.2px;color:var(--slate);margin-top:2px;}
  table.sched .brk{color:var(--slate);font-style:italic;}
  .wk-scroll{overflow-x:auto;margin-top:12px;}
  .wkgrid{display:grid;grid-template-columns:repeat(7,minmax(124px,1fr));gap:8px;min-width:900px;}
  .wkcol{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .wkcol h4{margin:0;padding:9px;text-align:center;font-size:13px;background:#faf6ef;border-bottom:1px solid var(--line);font-weight:800;}
  .wkitem{padding:7px 10px;border-bottom:1px solid var(--line);font-size:12px;color:#3c463f;}
  .wkitem:last-child{border-bottom:none;}
  .wkitem .wt{font-weight:700;color:var(--petrol-deep);font-variant-numeric:tabular-nums;margin-right:3px;}
  .wkitem.hl{background:var(--amber-soft);}
  .wkitem.hl .wt{color:var(--gold);}
  .wkteacher{color:var(--slate);font-size:11px;}
  .wkitem.wkempty{color:var(--slate);text-align:center;border-left:none;font-style:italic;}

  .pinput[readonly]{border-bottom:none;cursor:default;color:var(--petrol-deep);}
  .biz-only{display:none;}
  body.biz .biz-only{display:block;}

  /* weekly categories */
  .wkitem{border-left:3px solid var(--petrol);}
  .wkitem.ielts{border-left-color:#5C787E;}
  .wkitem.gen{border-left-color:#4A8A6A;background:#eef5f0;}
  .wkitem.open{border-left-color:#7c66c4;background:#f1eef9;}
  .wkitem.mock{border-left-color:var(--rose);background:var(--rose-soft);}
  .wkitem.thirty{border-left-color:var(--gold);background:var(--amber-soft);}
  .wkitem.thirty .wt{color:var(--gold);}
  .wkbadge{display:inline-block;margin-left:5px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:rgba(0,0,0,.06);color:#555;vertical-align:1px;}
  .wkitem.open .wkbadge{background:#e6e0f4;color:#5a4b86;}
  .wkitem.mock .wkbadge{background:#f3d9d4;color:#8f3636;}
  .wk-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;}
  .wl{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);}
  .wl::before{content:"";width:10px;height:10px;border-radius:3px;}
  .wl.ielts::before{background:#5C787E;}
  .wl.gen::before{background:#4A8A6A;}
  .wl.open::before{background:#7c66c4;}
  .wl.mock::before{background:var(--rose);}
  .wl.thirty::before{background:var(--gold);}
  /* bundle calculator */
  .calccard{margin-top:20px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--petrol);border-radius:14px;padding:20px 22px;max-width:560px;}
  .calchead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:800;font-size:15.5px;margin-bottom:8px;}
  .calchead .eqplus{color:var(--gold);font-size:18px;}
  .calcpack{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;color:var(--slate);font-weight:700;margin:6px 0 10px;}
  .calcrows{border-top:1px solid var(--line);padding-top:10px;}
  .calcrow{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:13.5px;}
  .calcrow .cn{color:#3c463f;}
  .calcrow .cv{font-weight:700;color:var(--ink);white-space:nowrap;}
  .calcrow .cv s{color:var(--slate);font-weight:400;margin-right:5px;}
  .calctotal{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-top:10px;padding-top:12px;border-top:2px solid var(--ink);}
  .calctotal .ctl{font-weight:800;font-size:15px;}
  .calctotal .ctv{font-weight:800;font-size:24px;color:var(--petrol-deep);}
  .calcsave{margin-top:6px;font-size:12.8px;color:var(--rose);font-weight:600;}
  .calcsave s{color:var(--slate);}

  /* FAQ accordion */
  .faqlist{margin-top:20px;display:flex;flex-direction:column;gap:12px;}
  .faq-item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .faq-item summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 20px;font-weight:800;font-size:15.5px;color:var(--ink);}
  .faq-item summary::-webkit-details-marker{display:none;}
  .faq-item summary:hover{color:var(--petrol-deep);}
  .faq-q{flex:1;}
  .faq-ico{flex:none;width:24px;height:24px;border-radius:50%;background:var(--amber-soft);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;transition:transform .2s;}
  .faq-item[open] .faq-ico{transform:rotate(45deg);}
  .faq-a{padding:0 20px 20px;font-size:14px;color:#3c463f;line-height:1.75;border-top:1px solid var(--line);}
  .faq-a>p:first-child{margin-top:16px;}
  .faq-a p{margin:0 0 10px;}
  .faq-ul{margin:8px 0 10px;padding-left:20px;}
  .faq-ul li{margin:6px 0;}
  .faq-a b{color:var(--ink);}
  .faq-foot{font-size:13px;color:var(--slate);}
  .faq-sub{font-weight:700;color:var(--ink);margin:4px 0 6px;}
  .faq-biz{margin-top:14px;padding:12px 14px;background:var(--violet-soft);border-radius:10px;font-size:12.9px;color:var(--violet);}
  .faq-biz b{display:block;color:#473a6e;margin-bottom:3px;font-size:12px;}
  .faq-src{margin-top:16px;font-size:12.3px;color:var(--slate);}

  .detail-stack{max-width:780px;}
  .detail-stack .panel{margin-top:16px;}
  .detail-stack .panel:first-child{margin-top:18px;}
  .reveal-btn{margin-top:2px;}
  .detail-prose{font-size:13.8px;color:#3c463f;margin:12px 0 0;line-height:1.75;}
  .detail-prose .todo{color:#9a5e0e;font-style:italic;}
  .cmppackbtns{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap;}
  .cmppackbtn{font-family:inherit;font-size:11px;font-weight:700;border:1.5px solid var(--line-strong);background:#fff;color:var(--ink);border-radius:6px;padding:3px 8px;cursor:pointer;}
  .cmppackbtn.on{background:var(--petrol);border-color:var(--petrol);color:#fff;}

  /* ===== presentation slide layout ===== */
  body{background:linear-gradient(135deg,#5C787E 0%,#3E5C63 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;}
  .wrap{width:min(96vw,1200px);aspect-ratio:16/9;max-height:94vh;margin:0;padding:0;background:var(--surface);border-radius:20px;box-shadow:0 24px 70px rgba(18,28,26,.40);display:flex;flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.45);}
  header{padding:16px 34px 0;flex:none;}
  header .topline{align-items:center;}
  .eyebrow{margin-bottom:6px;}
  h1{font-size:clamp(19px,2.3vw,25px);}
  .logo{height:46px;}
  nav{margin-top:12px;}
  .bizbanner{margin-top:10px;}
  .slide-scroll{flex:1;overflow-y:auto;padding:4px 34px 36px;}
  .slide-scroll::-webkit-scrollbar{width:10px;}
  .slide-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;}
  .slide-scroll::-webkit-scrollbar-track{background:transparent;}
  @media(max-width:820px){
    body{display:block;padding:0;background:var(--surface);}
    .wrap{width:100%;aspect-ratio:auto;max-height:none;height:auto;border-radius:0;box-shadow:none;border:none;}
    header{padding:24px 18px 0;}
    .slide-scroll{overflow:visible;padding:4px 18px 70px;}
  }

  /* presentation controls */
  .topctrls{display:flex;align-items:center;gap:12px;}
  .pageInd{font-size:13px;font-weight:700;color:var(--slate);font-variant-numeric:tabular-nums;}
  .ctrlbtn{font-family:inherit;font-weight:700;font-size:13.5px;border:1.5px solid var(--line-strong);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .15s;white-space:nowrap;}
  .ctrlbtn:hover{border-color:var(--petrol);color:var(--petrol-deep);}
  .pager{flex:none;position:relative;display:flex;align-items:center;justify-content:center;gap:14px;padding:11px 30px;border-top:1px solid var(--line);background:var(--surface);}
  .pgbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line-strong);background:#fff;color:var(--ink);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
  .pgbtn:hover:not(:disabled){border-color:var(--petrol);color:var(--petrol-deep);}
  .pgbtn:disabled{opacity:.32;cursor:default;}
  .pgdots{display:flex;align-items:center;gap:7px;}
  .pgdot{width:9px;height:9px;border-radius:50%;border:none;background:var(--line-strong);cursor:pointer;padding:0;transition:all .15s;}
  .pgdot:hover{background:var(--slate);}
  .pgdot.on{width:22px;height:14px;border-radius:5px;background:var(--gold);}
  .pgnum{font-size:13.5px;font-weight:700;color:var(--slate);font-variant-numeric:tabular-nums;}
  .pghint{position:absolute;right:28px;font-size:12px;color:var(--slate);}
  @media(max-width:820px){.pghint{display:none;}.pager{padding:10px 14px;}}

  /* ===== borderless full-bleed slide ===== */
  body{background:var(--surface);min-height:100vh;display:block;padding:0;}
  .wrap{position:relative;width:100vw;height:100vh;max-height:none;aspect-ratio:auto;margin:0;padding:0;background:var(--surface);border:none;border-radius:0;box-shadow:none;display:flex;flex-direction:column;overflow:hidden;}
  .slide-scroll{flex:1;overflow-y:auto;padding:6px 40px 30px;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;}
  .slide-scroll::-webkit-scrollbar{display:none;width:0;height:0;}
  .scrollnav{position:absolute;left:50%;transform:translateX(-50%);z-index:25;border:none;background:rgba(92,120,126,.94);color:#fff;font-weight:700;font-size:13px;border-radius:999px;padding:8px 18px;cursor:pointer;box-shadow:0 5px 16px rgba(0,0,0,.20);display:none;align-items:center;gap:6px;transition:background .15s,opacity .2s;}
  .scrollnav:hover{background:var(--petrol-deep);}
  .scrollnav.down{bottom:78px;}
  .scrollnav.up{top:122px;}
  .scrollnav.show{display:inline-flex;}
  @media(max-width:820px){
    body{display:block;}
    .wrap{width:100%;height:auto;min-height:100vh;}
    .slide-scroll{overflow:visible;padding:6px 18px 70px;}
    .scrollnav{display:none!important;}
  }

  /* overview v15 */
  .axisblock{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:18px 0 8px;}
  .coordcap{font-size:12.3px;color:var(--slate);font-weight:700;margin:16px 0 4px;text-align:center;}
  .coordsvg{width:100%;max-width:720px;display:block;margin:0 auto;height:auto;}
  .coordsvg .axl{font-size:12px;fill:var(--slate);font-weight:700;}
  .coordsvg .dotlbl{font-size:12px;fill:var(--ink);font-weight:600;}
  .group-label{grid-column:1/-1;font-size:13px;font-weight:800;color:var(--petrol-deep);letter-spacing:.05em;margin:10px 0 -2px;padding-left:10px;border-left:3px solid var(--gold);}
  .cardbadge{display:inline-block;font-size:11.5px;font-weight:800;padding:4px 12px;border-radius:999px;margin-bottom:9px;color:#fff;}
  .cardbadge.gold{background:var(--gold);}
  .cardbadge.petrol{background:var(--petrol);}
  .pcard.rec{border-color:var(--petrol);box-shadow:0 0 0 1px var(--petrol);}
  .card-more{margin:4px 0 12px;}
  .card-more summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--petrol-deep);list-style:none;padding:5px 0;}
  .card-more summary::-webkit-details-marker{display:none;}
  .card-more summary::before{content:"▾ ";}
  .card-more[open] summary::before{content:"▴ ";}
  .card-more .feat-list{margin-top:6px;margin-bottom:0;}
  .sched-h{font-size:16px;margin:6px 0 2px;font-weight:800;}

  /* header inline (v15) */
  .topline{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .logo{height:40px;}
  #nav{margin-top:0;border:none;display:flex;gap:3px;flex:1;flex-wrap:wrap;}
  #nav a{padding:7px 13px;border-radius:8px;border-bottom:none;}
  #nav a:hover{background:#f0ede5;}
  #nav a.active{background:var(--amber-soft);color:var(--ink);border-bottom:none;}
  .topctrls{margin-left:auto;}
  header{padding:14px 34px 0;}
  /* scroll buttons to right side */
  .scrollnav{position:absolute;right:14px;left:auto;bottom:auto;transform:none;width:42px;height:42px;border-radius:50%;padding:0;justify-content:center;font-size:15px;}
  .scrollnav.up{top:calc(50% - 28px);}
  .scrollnav.down{top:calc(50% + 28px);}
  @media(max-width:820px){.scrollnav{display:none!important;}}

  /* v16 refinements */
  header{padding:16px 36px 14px;}
  .slide-scroll{padding-top:14px;}
  /* ribbon tab (v14 style) */
  .ribrow{text-align:right;line-height:0;margin:-2px 0 8px;}
  .ribbon{position:static;display:inline-block;background:var(--gold);color:#fff;font-size:11.5px;font-weight:800;letter-spacing:.03em;padding:5px 13px;border-radius:8px;line-height:1.3;}
  .ribbon.recrib{background:var(--petrol);}
  .pcard.feat{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .pcard.rec{border-color:var(--petrol);box-shadow:0 0 0 1px var(--petrol);}
  /* clickable minimal card */
  .pcard{display:flex;flex-direction:column;text-decoration:none;color:inherit;cursor:pointer;transition:transform .12s,box-shadow .12s;}
  .pcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.10);}
  .pcard.feat:hover,.pcard.rec:hover{box-shadow:0 10px 24px rgba(0,0,0,.12),0 0 0 1px var(--gold);}
  .pcard.rec:hover{box-shadow:0 10px 24px rgba(0,0,0,.12),0 0 0 1px var(--petrol);}
  .pcard .ptag{margin-bottom:8px;}
  .pcard .fit{margin-top:2px;}
  .cardgo{margin-top:auto;color:var(--petrol-deep);font-weight:700;font-size:13.5px;padding-top:12px;}
  .pcard:hover .cardgo{text-decoration:underline;}
  /* scroll buttons bottom-right, hover reveal */
  .scrollnav{position:absolute;right:18px;left:auto;top:auto;transform:none;width:40px;height:40px;border-radius:50%;padding:0;justify-content:center;font-size:14px;opacity:0;transition:opacity .18s;}
  .scrollnav.up{bottom:120px;}
  .scrollnav.down{bottom:74px;}
  .scrollnav.show{display:inline-flex;opacity:1;}
  /* detail two-column grid */
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:1120px;align-items:start;}
  .detail-grid .panel{margin-top:0;}
  .panel-full{grid-column:1/-1;}
  @media(max-width:820px){.detail-grid{grid-template-columns:1fr;}}

  /* ===== teachers ===== */
  .tlead{background:var(--card);border:1px solid var(--gold);box-shadow:0 0 0 1px var(--gold);border-radius:16px;padding:26px 28px;margin:22px 0 24px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;}
  .tavatar{border-radius:50%;object-fit:cover;flex:none;background:#eee;}
  .tavatar-lg{width:110px;height:110px;}
  .tavatar-sm{width:72px;height:72px;}
  .tcard .tavatar{width:84px;height:84px;margin-bottom:12px;}
  .tlead-body{flex:1;min-width:220px;}
  .teyebrow{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--slate);margin-bottom:6px;text-transform:uppercase;}
  .teyebrow.gold{color:var(--gold);letter-spacing:.12em;}
  .tname-lg{font-size:24px;font-weight:800;margin-bottom:8px;}
  .tname{font-size:19px;font-weight:800;margin-bottom:6px;}
  .tname.sm{font-size:18px;}
  .tquote{font-size:15px;color:#3c463f;font-style:italic;margin:0 0 12px;}
  .tquote.sm{font-size:13.5px;margin-bottom:10px;}
  .ttags{display:flex;flex-wrap:wrap;gap:8px;}
  .ttag{font-size:12.5px;background:var(--amber-soft);color:#A85F35;padding:5px 12px;border-radius:999px;font-weight:700;}
  .tgroup-label{font-size:13px;font-weight:800;color:var(--petrol-deep);letter-spacing:.05em;margin:0 0 12px;padding-left:10px;border-left:3px solid var(--gold);}
  .tgrid{display:grid;gap:18px;margin-bottom:28px;}
  .tgrid-2{grid-template-columns:repeat(2,1fr);}
  .tgrid-3{grid-template-columns:repeat(3,1fr);}
  @media(max-width:820px){.tgrid-2,.tgrid-3{grid-template-columns:1fr;}}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;}
  .tbio{font-size:13px;color:var(--slate);margin:0;line-height:1.6;}

  /* ===== student cases ===== */
  .casegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:22px;}
  @media(max-width:760px){.casegrid{grid-template-columns:1fr;}}
  .casecard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;}
  .casehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .casename{font-size:18px;font-weight:800;}
  .caseplan{font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px;white-space:nowrap;}
  .caseplan.amber{background:var(--amber-soft);color:#A85F35;}
  .caseplan.petrol{background:var(--violet-soft);color:var(--petrol-deep);}
  .casescore{display:flex;align-items:center;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
  .scol{text-align:center;}
  .slbl{font-size:11px;color:var(--slate);font-weight:700;margin-bottom:4px;}
  .sval{font-size:26px;font-weight:800;}
  .sval.before{color:var(--rose);}
  .sval.after{color:var(--petrol);}
  .sval.big{font-size:22px;}
  .sarrow{font-size:20px;color:var(--gold);}
  .sdetail{font-size:12.5px;color:var(--slate);}
  .casenote{font-size:13.5px;color:#3c463f;margin:0 0 6px;}
  .casequote{font-size:13.5px;color:#3c463f;font-style:italic;margin:0;}

  /* redesigned plan-spec layout (parent-facing) */
  .specgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 26px;margin-top:2px;}
  .specitem{padding:0 0 12px;border-bottom:1px solid var(--line);min-width:0;}
  .specitem .slabel{display:block;font-size:11.5px;font-weight:800;color:var(--petrol);letter-spacing:.04em;margin-bottom:5px;}
  .specitem .svalue{font-size:14.5px;color:var(--ink);line-height:1.6;}
</style>
</head>

  function renderCompare(){
    foot.style.display="none";
    var html='<div class="viewhead"><h2>勾選比較方案差異</h2><p class="biz-only">勾選 2 個以上方案逐項對照；打底與小資可在價格欄切換堂數，價格與期限即時更新。有差異的列會標示。</p></div>';
    html+='<div class="selbar"><p class="seltitle">選擇要比較的方案</p>'+selectorHTML(compareSel,"data-cmp")
      +'<div class="selactions"><button class="btn small" id="cmpClear">清除</button>'
      +'<span class="selhint">已選 '+compareSel.length+' 個</span></div></div>';

    if(compareSel.length<2){
      html+='<div class="bundle-empty">請至少勾選 2 個方案來比較。</div>';
    }else{
      var cols=compareSel.map(function(id){return planById[id];}).filter(Boolean);
      html+='<div class="cmpwrap"><table class="cmp"><thead><tr><th class="rowlabel"></th>';
      cols.forEach(function(p){
        html+='<th class="planhead">'+p.name+(p.feat?'<span class="mini">主推</span>':(p.nonmain?'<span class="mini" style="color:var(--slate)">非主推</span>':''))+'</th>';
      });
      html+='</tr></thead><tbody>';
      compareRows.forEach(function(r){
        var raws=cols.map(function(p){
          if(r.key==="price")return priceText(p);
          if(r.key==="課程期限")return termOf(p);
          return p.specs[r.key]||"—";
        });
        var uniq={};raws.forEach(function(v){uniq[v]=1;});
        var differs=Object.keys(uniq).length>1;
        html+='<tr class="'+(differs?'differs':'')+'"><td class="rowlabel">'+r.label+'</td>';
        cols.forEach(function(p,ci){
          var cell=raws[ci];
          if(r.key==="price"&&p.packs){
            var sel=packSel[p.id]||0;
            cell+='<div class="cmppackbtns">';
            p.packs.forEach(function(pk,i){cell+='<button type="button" class="cmppackbtn'+(i===sel?" on":"")+'" data-cmppack="'+p.id+'" data-cmpidx="'+i+'">'+pk.label+'</button>';});
            cell+='</div>';
          }
          html+='<td class="cell'+(r.key==="price"?" priceC":"")+'">'+cell+'</td>';
        });
        html+='</tr>';
      });
      html+='</tbody></table></div>';
      html+='<div class="cmpnote"><span class="legendline"><i></i>底色標示＝該列各方案有差異</span></div>';
    }
    app.innerHTML=html;
    callWire(app);
    app.querySelectorAll("[data-cmp]").forEach(function(cb){
      cb.addEventListener("change",function(){
        var id=cb.getAttribute("data-cmp");
        if(cb.checked){if(compareSel.indexOf(id)<0)compareSel.push(id);}
        else{compareSel=compareSel.filter(function(x){return x!==id;});}
        renderCompare();
      });
    });
    app.querySelectorAll("[data-cmppack]").forEach(function(b){
      b.addEventListener("click",function(){packSel[b.getAttribute("data-cmppack")]=parseInt(b.getAttribute("data-cmpidx"),10);renderCompare();});
    });
    var clr=document.getElementById("cmpClear");
    if(clr)clr.addEventListener("click",function(){compareSel=[];renderCompare();});
  }

  var faqs=[
    {
      q:"雅思提升一分需要多久的時間？",
      a:'<p><b>基準：每提升 0.5 分約需 200 小時的指導性學習。</b>依劍橋大學英語考評部等機構的 CEFR 指標，把英語能力提升一個等級（約等於雅思 0.5–1.0 分）大約需要 200 小時。若以自學為主，提升 0.5 分通常要估 <b>200–300 小時</b>。</p>'
        +'<p>換算成時間（以每天 3 小時計）：200 小時 ≈ <b>約 2.5 個月</b>；300 小時 ≈ <b>約 3.5 個月</b>。這是平均參考值——用對策略、提高「學習品質」可以縮短；反之低效學習，半年沒進步也不少見。</p>'
        +'<p class="faq-sub">以目前總分（OA）約 5.5 的考生為例，不同目標的路線圖：</p>'
        +'<ul class="faq-ul">'
        +'<li><b>目標 6.0（基礎鞏固）</b>：約 2–3 個月（100–200 小時）。多為交換生。重點先補基礎詞彙與文法漏洞，再練官方真題。</li>'
        +'<li><b>目標 6.5（多數大學門檻）</b>：約 4–5 個月（300–400 小時）。多為本科／碩士申請。要突破「6.0 瓶頸」，主攻弱項（口說、寫作）；常見策略是讓閱讀、聽力拿高分，口說與寫作守在 5.5–6.0，把總分拉到 6.5。</li>'
        +'<li><b>目標 7.0 以上（頂尖院校／研究所／技術移民）</b>：約 6 個月至 1 年以上（500 小時以上）。6.5→7.0 的難度與前面完全不同量級，考的是英語硬實力，需要長期大量輸入（英語新聞、學術閱讀）。</li>'
        +'</ul>'
        +'<p class="faq-foot">每個人差異很大，建議先做程度檢測，再依目標回推所需時間與每週時數。</p>'
    },
    {
      q:"技巧課程（30hrs）和實戰課程（吃到飽總課表）差在哪？",
      a:'<p>兩者互補，差別在「學方法」還是「練實戰」：</p>'
        +'<ul class="faq-ul">'
        +'<li><b>技巧課程（30hrs 速成班）</b>：著重<b>解題技巧</b>的教授——四科各類題型怎麼拆、怎麼答，先把方法建立起來。</li>'
        +'<li><b>實戰課程（總課表）</b>：著重用<b>最新題庫的題目實際練習</b>——大量演練、累積手感與實戰經驗，課堂老師即時反饋。</li>'
        +'</ul>'
        +'<p class="faq-foot">一般建議先上技巧課把方法學會，再用實戰課大量練習，效果最好。</p>'
    }
  ];

  /* ---------------- router ---------------- */
  function updateScrollNav(){
    if(!slideScroll)return;
    var el=slideScroll, sd=document.getElementById("scrollDown"), su=document.getElementById("scrollUp");
    if(!sd||!su)return;
    var canDown=(el.scrollHeight-el.clientHeight-el.scrollTop)>8;
    var canUp=el.scrollTop>8;
    sd.classList.toggle("show",canDown&&navHover);
    su.classList.toggle("show",canUp&&navHover);
  }

  function setNav(route){
    document.querySelectorAll("#nav a").forEach(function(a){
      a.classList.toggle("active",a.getAttribute("data-route")===route);
    });
  }

  var pages=["plan","teachers","cases","levelmap","compare","schedule","faq"];
  function curRoute(){var h=location.hash.replace(/^#\//,"");if(h.indexOf("plan/")===0)return "plan";return h||"overview";}
  function updatePager(){
    var pager=document.getElementById("pager");
    var ind=document.getElementById("pageInd");
    var idx=pages.indexOf(curRoute());
    if(idx<0){pager.style.display="none";ind.textContent="";return;}
    pager.style.display="";
    var label=(idx+1)+" / "+pages.length;
    ind.textContent=label;
    document.getElementById("pgNum").textContent=label;
    document.getElementById("pgDots").innerHTML=pages.map(function(p,i){
      return '<button type="button" class="pgdot'+(i===idx?" on":"")+'" data-page="'+p+'"></button>';
    }).join("");
    document.getElementById("pgPrev").disabled=(idx===0);
    document.getElementById("pgNext").disabled=(idx===pages.length-1);
    document.querySelectorAll(".pgdot").forEach(function(d){
      d.addEventListener("click",function(){location.hash="#/"+d.getAttribute("data-page");});
    });
  }
  function goPage(dir){
    var idx=pages.indexOf(curRoute());
    if(idx<0)return;
    var ni=idx+dir;
    if(ni>=0&&ni<pages.length)location.hash="#/"+pages[ni];
  }

  function route(){
    var h=location.hash.replace(/^#\//,"");
    if(h.indexOf("plan/")===0){setNav("plan");renderDetail(h.slice(5));}
    else if(h==="teachers"){setNav("teachers");renderTeachers();}
    else if(h==="cases"){setNav("cases");renderCases();}
    else if(h==="compare"){setNav("compare");renderCompare();}
    else if(h==="levelmap"){setNav("levelmap");renderLevelMap();}
    else if(h==="schedule"){setNav("schedule");renderSchedule();}
    else if(h==="faq"){setNav("faq");renderFAQ();}
    else{setNav("plan");renderDetail("exam14");}
    if(slideScroll)slideScroll.scrollTop=0;
    updatePager();
    requestAnimationFrame(updateScrollNav);
  }
  window.addEventListener("hashchange",route);

  document.getElementById("pgPrev").addEventListener("click",function(){goPage(-1);});
  document.getElementById("pgNext").addEventListener("click",function(){goPage(1);});
  document.getElementById("scrollDown").addEventListener("click",function(){slideScroll.scrollBy({top:Math.round(slideScroll.clientHeight*0.88),behavior:"smooth"});});
  document.getElementById("scrollUp").addEventListener("click",function(){slideScroll.scrollBy({top:-Math.round(slideScroll.clientHeight*0.88),behavior:"smooth"});});
  document.addEventListener("mousemove",function(e){
    var h=((window.innerWidth-e.clientX)<200)&&((window.innerHeight-e.clientY)<240);
    if(h!==navHover){navHover=h;updateScrollNav();}
  });
  slideScroll.addEventListener("scroll",updateScrollNav);
  window.addEventListener("resize",function(){requestAnimationFrame(updateScrollNav);});

  // fullscreen
  var fsBtn=document.getElementById("fsBtn");
  function toggleFS(){
    var el=document.documentElement;
    if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}
    else{(document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);}
  }
  fsBtn.addEventListener("click",toggleFS);
  document.addEventListener("fullscreenchange",function(){
    fsBtn.textContent=document.fullscreenElement?"⤡ 結束全螢幕":"⛶ 全螢幕";
  });

  // keyboard arrows for page turning
  document.addEventListener("keydown",function(e){
    var t=(e.target&&e.target.tagName)||"";
    if(t==="INPUT"||t==="TEXTAREA"||t==="SELECT")return;
    if(e.key==="ArrowRight"){goPage(1);}
    else if(e.key==="ArrowLeft"){goPage(-1);}
  });

  if(!location.hash)location.hash="#/plan/exam14"; else route();
})();
